<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>hanamisakip-Guide</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <!-- 设置浏览器图标 -->
  <link rel="icon" href="./assets/logo/favicon.ico">
  <!-- 默认主题 -->
  <link rel="stylesheet" href="./assets/docsify/theme-simple-dark.css">
</head>

<body>
  <!-- 定义加载时候的动作 -->
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'hanamisakip-Guide',
      repo: 'https://github.com/HanamiSakiP',
      // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
      loadSidebar: true,
      // 导航栏支持，默认加载的是项目根目录下的_navbar.md文件
      loadNavbar: true,
      // 封面支持，默认加载的是项目根目录下的_coverpage.md文件
      // coverpage: true,
      // coverpage: './assets/docs/_coverpage.md',
      // hh
      loadSidebar: './assets/docs/_sidebar.md',
      loadNavbar: './assets/docs/_navbar.md',
      // 最大支持渲染的标题层级
      maxLevel: 5,
      // 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级（建议配置为2-4）
      subMaxLevel: 3,
      // 小屏设备下合并导航栏到侧边栏
      mergeNavbar: true,
      /*搜索相关设置*/
      search: {
        maxAge: 86400000,// 过期时间，单位毫秒，默认一天
        paths: 'auto',// 注意：仅适用于 paths: 'auto' 模式
        placeholder: '搜索',
        // 支持本地化
        placeholder: {
          '/zh-cn/': '搜索',
          '/': 'Type to search'
        },
        noData: '找不到结果',
        depth: 4,
        hideOtherSidebarContent: false,
        namespace: 'hanamisakip-Guide',
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="./assets/docsify/v4/docsify.min.js"></script>
  <!-- 图片放大缩小支持 -->
  <script src="./assets/docsify/v4/zoom-image.min.js"></script>
  <!-- 搜索功能支持 -->
  <script src="./assets/docsify/v4/search.min.js"></script>
  <!-- code -->
  <script src="./assets/docsify/code/prism-bash.min.js"></script>
  <script src="./assets/docsify/code/prism-c.min.js"></script>
  <script src="./assets/docsify/code/prism-go.min.js"></script>
  <script src="./assets/docsify/code/prism-python.min.js"></script>
  <script src="./assets/docsify/code/prism-javascript.min.js"></script>
  <script src="./assets/docsify/code/prism-java.min.js"></script>
  <script src="./assets/docsify/code/prism-markdown.min.js"></script>
  <!-- emoji表情支持 -->
  <script src="./assets/docsify/emoji.min.js"></script>
  <!--代码块复制代码-->
  <script src="./assets/docsify/docsify-copy-code.min.js"></script>
</body>

</html>
