# /etc/containers/registries.conf
# 允许直接使用短名称（如 debian）搜索镜像
unqualified-search-registries = ['docker.io']

[[registry]]
prefix = "docker.io"
location = "docker.io"
# 按顺序配置多个镜像源，Podman 会依次尝试
    [[registry.mirror]]
    location = "docker.xuanyuan.me"
    [[registry.mirror]]
    location = "docker.1ms.run"
    [[registry.mirror]]
    location = "hub.rat.dev"

[[registry]]
prefix = "registry.k8s.io"
location = "registry.k8s.io"
    [[registry.mirror]]
    location = "docker-k8s.xuanyuan.me"